[project]
name = "engineering_team_x"
version = "0.1.0"
description = "engineering_team_x using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,litellm,tools]>=1.15.22,<2.0.0",
    "gradio>=6.28.0",
]

[project.scripts]
engineering_team_x = "engineering_team_x.main:run"
run_crew = "engineering_team_x.main:run"
train = "engineering_team_x.main:train"
replay = "engineering_team_x.main:replay"
test = "engineering_team_x.main:test"
run_with_trigger = "engineering_team_x.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "9899bb8c-27ce-43be-ab31-8624b90a47ff"
